    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexScores | Professional Live Football Intelligence</title>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #111827;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        nav {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); boxShadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); boxShadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); boxShadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .section-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Match Cards */
        .match-grid {
            display: grid;
            gap: 16px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .match-card:hover {
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .team.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        .team-name {
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
        }

        /* Center Match Info */
        .match-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 140px;
        }

        .match-status-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            color: var(--accent-green);
            background: var(--accent-glow);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .score-board {
            font-size: 2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            background: linear-gradient(180deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Status States */
        .state-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
        }

        @media (max-width: 768px) {
            .match-card {
                grid-template-columns: 1fr;
                gap: 12px;
                text-align: center;
            }
            .team.home, .team.away {
                justify-content: center;
                text-align: center;
            }
            .team {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">APEX<span>SCORES</span></div>
        <div class="live-indicator">
            <div class="pulse-dot"></div>
            LIVE FEED ACTIVE
        </div>
    </nav>

    <div class="container">
        <div class="section-title">Today's Fixtures & Real-Time Data</div>
        <div class="match-grid" id="matches-container">
            <div class="state-box">Initializing secure API stream...</div>
        </div>
    </div>

    <script>
        const API_KEY = 'fc2838cd1755a51232af5ebebe11bf92'; // Integrated API key
        const today = new Date().toISOString().split('T')[0];

        async function fetchLiveMatches() {
            const container = document.getElementById('matches-container');
            
            try {
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });
                
                const data = await response.json();
                
                if (data.errors && Object.keys(data.errors).length > 0) {
                    container.innerHTML = `<div class="state-box" style="color: var(--danger);">Authentication or quota error encountered with API service.</div>`;
                    return;
                }

                const matches = data.response;

                if (!matches || matches.length === 0) {
                    container.innerHTML = `<div class="state-box">No matches scheduled for transmission today (${today}).</div>`;
                    return;
                }

                let htmlContent = '';
                matches.forEach(match => {
                    const homeTeam = match.teams.home;
                    const awayTeam = match.teams.away;
                    const goalsHome = match.goals.home !== null ? match.goals.home : 0;
                    const goalsAway = match.goals.away !== null ? match.goals.away : 0;
                    const status = match.fixture.status.short; // e.g., 'NS', '1H', 'FT'

                    htmlContent += `
                        <div class="match-card">
                            <div class="team home">
                                <span class="team-name">${homeTeam.name}</span>
                                <img class="team-logo" src="${homeTeam.logo}" alt="${homeTeam.name}">
                            </div>
                            <div class="match-center">
                                <span class="match-status-badge">${status}</span>
                                <div class="score-board">${goalsHome} &mdash; ${goalsAway}</div>
                            </div>
                            <div class="team away">
                                <img class="team-logo" src="${awayTeam.logo}" alt="${awayTeam.name}">
                                <span class="team-name">${awayTeam.name}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error('Data pipeline error:', error);
                container.innerHTML = `<div class="state-box">Network interruption. Retrying connection...</div>`;
            }
        }

        // Run instantly on load
        fetchLiveMatches();

        // Auto-refresh metrics every 60 seconds
        setInterval(fetchLiveMatches, 60000);
    </script>
</body>
      </html>
